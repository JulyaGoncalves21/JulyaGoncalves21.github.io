<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Synthetic campaign segmentation</title><desc id="d">Conceptual dashboard with fictional reach, engagement, conversion and customer groups.</desc><rect width="1200" height="720" fill="#e8efec"/><rect x="42" y="36" width="1116" height="648" rx="28" fill="#fff"/><rect x="42" y="36" width="270" height="648" rx="28" fill="#123b3b"/><text x="82" y="105" font-family="Arial" font-size="13" letter-spacing="2" fill="#f4d9e5">CAMPAIGN A</text><text x="82" y="153" font-family="Georgia" font-size="31" fill="#fff">Audience</text><text x="82" y="190" font-family="Georgia" font-size="31" fill="#fff">intelligence</text><g font-family="Arial"><text x="82" y="252" font-size="12" fill="#a8c2bc">CAMPAIGN STATUS</text><rect x="82" y="270" width="120" height="33" rx="16" fill="#b33670"/><text x="142" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">ACTIVE</text><text x="82" y="358" font-size="12" fill="#a8c2bc">AUDIENCE</text><text x="82" y="395" font-size="17" font-weight="700" fill="#fff">Customer A groups</text><text x="82" y="450" font-size="12" fill="#a8c2bc">CHANNELS</text><text x="82" y="485" font-size="15" fill="#fff">Email · Digital · Event</text><text x="82" y="558" font-size="12" fill="#a8c2bc">DATA NOTE</text><text x="82" y="590" font-size="13" fill="#d8e5e1">All values are fictional</text><text x="356" y="105" font-family="Georgia" font-size="38" fill="#102725">Segmentation &amp; engagement</text><rect x="356" y="152" width="228" height="110" rx="15" fill="#f7f5f0" stroke="#c9d5d0"/><text x="380" y="185" font-size="12" fill="#566966">REACH</text><text x="380" y="229" font-size="34" font-weight="700" fill="#102725">12,500</text><rect x="604" y="152" width="228" height="110" rx="15" fill="#f7f5f0" stroke="#c9d5d0"/><text x="628" y="185" font-size="12" fill="#566966">ENGAGEMENT</text><text x="628" y="229" font-size="34" font-weight="700" fill="#b33670">72%</text><rect x="852" y="152" width="250" height="110" rx="15" fill="#f7f5f0" stroke="#c9d5d0"/><text x="876" y="185" font-size="12" fill="#566966">CONVERSION SIGNAL</text><text x="876" y="229" font-size="34" font-weight="700" fill="#1f5b58">18%</text><rect x="356" y="292" width="350" height="318" rx="17" fill="#f7f5f0" stroke="#c9d5d0"/><text x="384" y="332" font-size="13" font-weight="700" fill="#102725">CUSTOMER GROUPS</text><circle cx="530" cy="460" r="102" fill="none" stroke="#d8e5e1" stroke-width="42"/><path d="M530 358a102 102 0 0 1 87 155" fill="none" stroke="#b33670" stroke-width="42"/><path d="M617 513a102 102 0 0 1-163 24" fill="none" stroke="#1f5b58" stroke-width="42"/><text x="530" y="455" text-anchor="middle" font-size="13" fill="#566966">SEGMENTS</text><text x="530" y="482" text-anchor="middle" font-size="24" font-weight="700" fill="#102725">A · B · C</text><text x="384" y="582" font-size="11" fill="#566966">Group A 42% · Group B 35% · Group C 23%</text><rect x="734" y="292" width="368" height="318" rx="17" fill="#123b3b"/><text x="764" y="332" font-size="13" font-weight="700" fill="#fff">CONVERSION FUNNEL</text><rect x="764" y="370" width="292" height="38" rx="8" fill="#315f5d"/><text x="780" y="395" font-size="13" fill="#fff">Reached</text><text x="1036" y="395" text-anchor="end" font-size="13" fill="#fff">12,500</text><rect x="784" y="426" width="252" height="38" rx="8" fill="#427873"/><text x="800" y="451" font-size="13" fill="#fff">Engaged</text><text x="1016" y="451" text-anchor="end" font-size="13" fill="#fff">9,000</text><rect x="814" y="482" width="192" height="38" rx="8" fill="#b33670"/><text x="830" y="507" font-size="13" fill="#fff">Action</text><text x="986" y="507" text-anchor="end" font-size="13" fill="#fff">2,250</text><text x="764" y="572" font-size="11" fill="#d8e5e1">Demonstration logic—not business results</text></g></svg>
