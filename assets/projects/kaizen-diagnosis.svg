<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Kaizen diagnosis</title><desc id="d">Synthetic before, improvement and result narrative for a fictional initiative.</desc><rect width="1200" height="720" fill="#e8efec"/><rect x="46" y="38" width="1108" height="644" rx="28" fill="#fff"/><text x="90" y="105" font-family="Arial" font-size="13" letter-spacing="2" fill="#b33670">STRUCTURED DIAGNOSIS · TEAM B</text><text x="90" y="154" font-family="Georgia" font-size="39" fill="#102725">Process Handover Improvement</text><text x="90" y="190" font-family="Arial" font-size="15" fill="#566966">A concise narrative that connects the operating issue to the change.</text><g font-family="Arial"><rect x="90" y="247" width="300" height="330" rx="18" fill="#f7f5f0" stroke="#c9d5d0"/><circle cx="137" cy="298" r="22" fill="#123b3b"/><text x="137" y="304" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">01</text><text x="175" y="304" font-size="14" font-weight="700" fill="#b33670">BEFORE</text><text x="124" y="366" font-size="20" font-weight="700" fill="#102725">Fragmented handoffs</text><text x="124" y="407" font-size="15" fill="#566966">Updates arrived through</text><text x="124" y="432" font-size="15" fill="#566966">different channels, making</text><text x="124" y="457" font-size="15" fill="#566966">ownership less visible.</text><rect x="450" y="247" width="300" height="330" rx="18" fill="#123b3b"/><circle cx="497" cy="298" r="22" fill="#b33670"/><text x="497" y="304" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">02</text><text x="535" y="304" font-size="14" font-weight="700" fill="#f4d9e5">IMPROVEMENT</text><text x="484" y="366" font-size="20" font-weight="700" fill="#fff">Shared information routine</text><text x="484" y="407" font-size="15" fill="#d8e5e1">Defined the minimum fields,</text><text x="484" y="432" font-size="15" fill="#d8e5e1">responsible role and review</text><text x="484" y="457" font-size="15" fill="#d8e5e1">point for each handoff.</text><rect x="810" y="247" width="300" height="330" rx="18" fill="#f7f5f0" stroke="#c9d5d0"/><circle cx="857" cy="298" r="22" fill="#1f5b58"/><text x="857" y="304" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">03</text><text x="895" y="304" font-size="14" font-weight="700" fill="#b33670">RESULT</text><text x="844" y="366" font-size="20" font-weight="700" fill="#102725">Clearer coordination</text><text x="844" y="407" font-size="15" fill="#566966">Stakeholders can see status,</text><text x="844" y="432" font-size="15" fill="#566966">next action and ownership</text><text x="844" y="457" font-size="15" fill="#566966">in one consistent view.</text><path d="M390 412h60m300 0h60" stroke="#b33670" stroke-width="4"/></g></svg>
