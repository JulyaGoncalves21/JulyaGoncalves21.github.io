ght="700" fill="#102725">VALIDATING</text><rect x="834" y="286" width="250" height="151" rx="13" fill="#fff"/><rect x="834" y="286" width="6" height="151" rx="3" fill="#1f5b58"/><text x="859" y="320" font-size="12" fill="#566966">TEAM A · VISIBILITY</text><text x="859" y="353" font-size="17" font-weight="700" fill="#102725">Portfolio Visibility</text><text x="859" y="378" font-size="17" font-weight="700" fill="#102725">Routine</text><rect x="859" y="400" width="122" height="22" rx="11" fill="#f4d9e5"/><text x="920" y="415" text-anchor="middle" font-size="11" font-weight="700" fill="#b33670">PDCA · CHECK</text><text x="91" y="641" font-size="13" fill="#566966">Fictional initiatives and roles · No monetary values · No internal records</text></g></svg>
