<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Generic document status</title><desc id="d">Conceptual status checklist using no real or official document design.</desc><rect width="1200" height="720" fill="#e8efec"/><rect x="58" y="42" width="1084" height="636" rx="30" fill="#fff"/><text x="105" y="120" font-family="Arial" font-size="13" letter-spacing="2" fill="#b33670">GENERIC FOLLOW-UP</text><text x="105" y="168" font-family="Georgia" font-size="40" fill="#102725">Document status</text><text x="105" y="205" font-family="Arial" font-size="15" fill="#566966">A conceptual checklist—not an official record, form or document.</text><rect x="105" y="258" width="645" height="326" rx="18" fill="#f7f5f0" stroke="#c9d5d0"/><g font-family="Arial"><g><circle cx="155" cy="315" r="18" fill="#d7eee5"/><path d="m146 315 7 7 13-15" fill="none" stroke="#23835d" stroke-width="4"/><text x="195" y="310" font-size="12" fill="#566966">STATUS ITEM 01</text><text x="195" y="336" font-size="18" font-weight="700" fill="#102725">Required information received</text></g><line x1="138" y1="370" x2="716" y2="370" stroke="#c9d5d0"/><g><circle cx="155" cy="425" r="18" fill="#d7eee5"/><path d="m146 425 7 7 13-15" fill="none" stroke="#23835d" stroke-width="4"/><text x="195" y="420" font-size="12" fill="#566966">STATUS ITEM 02</text><text x="195" y="446" font-size="18" font-weight="700" fill="#102725">Operational review complete</text></g><line x1="138" y1="480" x2="716" y2="480" stroke="#c9d5d0"/><g><circle cx="155" cy="535" r="18" fill="#f4d9e5"/><circle cx="155" cy="535" r="5" fill="#b33670"/><text x="195" y="530" font-size="12" fill="#566966">STATUS ITEM 03</text><text x="195" y="556" font-size="18" font-weight="700" fill="#102725">Follow-up scheduled</text></g><rect x="798" y="258" width="286" height="326" rx="18" fill="#123b3b"/><text x="836" y="310" font-size="12" letter-spacing="2" fill="#a8c2bc">PUBLIC-SAFE VIEW</text><text x="836" y="368" font-family="Georgia" font-size="27" fill="#fff">No official marks.</text><text x="836" y="410" font-size="16" fill="#d8e5e1">No document numbers.</text><text x="836" y="443" font-size="16" fill="#d8e5e1">No QR codes.</text><text x="836" y="476" font-size="16" fill="#d8e5e1">No personal data.</text><circle cx="941" cy="532" r="26" fill="#b33670"/><path d="m928 532 9 9 18-21" fill="none" stroke="#fff" stroke-width="4"/></g></svg>
